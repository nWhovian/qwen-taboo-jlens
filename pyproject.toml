requires-python = ">=3.11,<3.14"
dependencies = [
  "accelerate",
  "datasets",
  "huggingface-hub",
  "ipykernel",
  "jupyter-collaboration",
  "jupyter-mcp-tools",
  "jupyterlab",
  "matplotlib",
  "pandas",
  "peft",
  "pyarrow",
  "safetensors",
  "scikit-learn",
  "seaborn",
  "transformers>=4.57.1",
]

[tool.ruff]
line-length = 100

