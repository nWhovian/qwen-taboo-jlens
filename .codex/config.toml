# Loaded only after the project is trusted. On macOS the launcher reaches the
# RunPod MCP server through the stable `runpod-jlens` SSH alias; on a remote
# Codex project it connects to the private Jupyter server directly.

[mcp_servers.jupyter]
command = "bash"
args = ["scripts/start_jupyter_mcp.sh"]
cwd = "."
startup_timeout_sec = 30
tool_timeout_sec = 1800
