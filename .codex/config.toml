# Project-scoped Codex MCP configuration. The project must be trusted.
# JUPYTER_TOKEN must already exist in the remote Codex login environment.

[mcp_servers.jupyter]
command = "uvx"
args = ["jupyter-mcp-server@latest"]
env_vars = ["JUPYTER_TOKEN"]
startup_timeout_sec = 30
tool_timeout_sec = 600

[mcp_servers.jupyter.env]
JUPYTER_URL = "http://127.0.0.1:8888"
ALLOW_IMG_OUTPUT = "true"

